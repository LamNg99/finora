line-length = 80
# Prevent ruff from normalising its own config (preview mode rewrites codes → slugs)
extend-exclude = ["ruff.toml"]

[lint]
extend-select = [
    # See: https://docs.astral.sh/ruff/rules
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "RUF",   # ruff-specific
    "A",     # flake8-builtins
    "C",     # flake8-comprehensions + mccabe
    "ANN",   # flake8-annotations
    "N80",   # pep8-naming (class/function/argument names)
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "FBT",   # flake8-boolean-trap
    "I",     # isort
    "DTZ",   # flake8-datetimez
    "YTT",   # flake8-2020 (sys.version misuse)
    "COM",   # flake8-commas
    "EXE",   # flake8-executable
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "D",     # pydocstyle
    "T",     # flake8-debugger + flake8-print
    "RET503", # implicit-return
    "RET504", # unnecessary-assignment
    "RET505", # superfluous-else-return
    "RET506", # superfluous-else-raise
    "RET507", # superfluous-else-continue
    "RET508", # superfluous-else-break
    "SLF",    # flake8-self (private member access)
    "PLW1514", # unspecified-encoding

    # Security (flake8-bandit)
    "S",

    "ARG",
    "BLE",
    "C4",
    "DOC501", # docstring-missing-exception
    "DOC502", # docstring-extraneous-exception
    "FLY",
    "ISC001", # single-line-implicit-string-concatenation (see ignore below)
    "N",
    "PERF",
    "PIE",
    "PGH",
    "PLC",
    "PLE",
    "PLR01",
    "PLR02",
    "TID251",  # banned-api (manual-from-import)
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR1704", # redefined-argument-from-local
    "PLR1711", # useless-return
    "PLR1714", # repeated-equality-comparison
    "PLR1722", # sys-exit-alias
    "PLR1730", # if-stmt-min-max
    "PLR1733", # unnecessary-dict-index-lookup
    "PLR1736", # unnecessary-list-index-lookup
    "PLR2004", # magic-value-comparison
    "PLR2044", # empty-comment
    "PLR5501", # collapsible-else-if
    "PLR6201", # literal-membership
    "PLR6301", # no-self-use

    "PLW",
    "PTH",
    "PYI",
    "UP",
    "FURB",
    "PLE0704", # misplaced-bare-raise
    "T20",
    "TC",
    "TRY002",  # raise-vanilla-class
    "TRY004",  # type-check-without-type-error
    "TRY201",  # verbose-raise
    "TRY203",  # useless-try-except
    "TRY301",  # raise-within-try
    "TRY400",  # error-instead-of-exception
    "TRY401",  # verbose-log-message

    # Library-specific rules
    "FAST",  # FastAPI
]

preview = true

# COM812 and ISC001 conflict with ruff-format — formatter owns trailing commas
# and implicit string concatenation style. Enabling both causes a check/format
# loop where --fix and ruff-format undo each other.
ignore = ["COM812", "ISC001"]

[lint.isort]
# Explicit first-party declaration so isort is consistent regardless of
# working directory (pre-commit runs from repo root; manual runs from backend/).
known-first-party = ["app"]

[lint.per-file-ignores]
# Enforce pydocstyle only in routers
"!**/*router*.py" = ["D"]
# types.py follows the project convention of using this filename for type
# definitions; renaming it would break all existing imports across the codebase.
"types.py" = ["A005"]   # stdlib-module-shadowing
# Routers should not document exceptions
"**/*router*.py" = ["DOC501"]  # docstring-missing-exception
