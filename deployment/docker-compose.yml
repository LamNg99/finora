services:
  api:
    image: ${IMAGE}:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env
    volumes:
      - ./finora.db:/app/finora.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
