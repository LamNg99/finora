# 30 requests/min per IP on the trigger endpoint
limit_req_zone $binary_remote_addr zone=trigger_limit:10m rate=30r/m;

map $http_user_agent $is_bad_bot {
    default                     0;
    ~*googlebot                 0;
    ~*bingbot                   0;
    ~*(bot|crawler|spider)      1;
}

server {
    server_name finoraquant.com www.finoraquant.com;

    if ($is_bad_bot) { return 404; }

    root /var/www/finora;
    index index.html;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Trigger endpoint — rate-limited
    location = /api/trigger {
        limit_req zone=trigger_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8001/trigger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # All other /api/* — strips /api prefix before proxying to FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/finoraquant.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/finoraquant.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.finoraquant.com) {
        return 301 https://finoraquant.com$request_uri;
    } # managed by Certbot

    if ($host = finoraquant.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name finoraquant.com www.finoraquant.com;
    return 404; # managed by Certbot
}
